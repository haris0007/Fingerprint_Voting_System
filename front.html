<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fingerprint Authentication</title>
</head>
<body>
    <h2>Register</h2>
    <input type="email" id="email" placeholder="Enter Email">
    <button onclick="register()">Register with Fingerprint</button>

    <h2>Login</h2>
    <input type="email" id="emailLogin" placeholder="Enter Email">
    <button onclick="checkUser()">Login with Fingerprint</button>

    <h2>Find Who</h2>
    <button onclick="findWho()">Find Who</button>

    <script>
        async function getFingerprint() {
            if (!window.PublicKeyCredential) {
                alert("WebAuthn not supported on this device!");
                return null;
            }

            try {
                const credential = await navigator.credentials.create({
                    publicKey: {
                        challenge: new Uint8Array(32),
                        rp: { name: "My App" },
                        user: { id: new Uint8Array(16), name: "user", displayName: "User" },
                        pubKeyCredParams: [{ type: "public-key", alg: -7 }],
                        authenticatorSelection: { authenticatorAttachment: "platform" },
                    }
                });

                return btoa(String.fromCharCode(...new Uint8Array(credential.rawId)));
            } catch (err) {
                alert("Fingerprint authentication failed!");
                return null;
            }
        }

        async function register() {
            const email = document.getElementById("email").value;
            const fingerprintId = await getFingerprint();
            if (!fingerprintId) return;

            const res = await fetch("http://localhost:3000//fingerprint-auth/register", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email, fingerprintId }),
            });

            const data = await res.json();
            alert(data.message);
        }

        async function checkUser() {
            const email = document.getElementById("emailLogin").value;
            const fingerprintId = await getFingerprint();
            if (!fingerprintId) return;

            const res = await fetch("http://localhost:3000//fingerprint-auth/checkuser", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email, fingerprintId }),
            });

            const data = await res.json();
            alert(data.message);
        }

        async function findWho() {
            const fingerprintId = await getFingerprint();
            if (!fingerprintId) return;

            const res = await fetch("http://localhost:3000//fingerprint-auth/findwho", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ fingerprintId }),
            });

            const data = await res.json();
            alert(data.message);
        }
    </script>
</body>
</html>
